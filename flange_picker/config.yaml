# Vse konstante in pragovi sistema. Nic ni hardcodirano v kodi -
# koda bere izkljucno iz te datoteke (glej config.py).

flange:
  d_out_mm: 49.0            # zunanji premer prirobnice (podal uporabnik)
  d_in_mm: 23.0             # OCENA z fotografije (~0.47 zunanjega) - IZMERI in popravi;
                            # od tega je odvisno parjenje notranje in zunanje elipse
  diameter_tolerance_mm: 0.5
  thickness_min_mm: 1.0
  thickness_max_mm: 2.0

box:
  w_mm: 400.0               # notranja sirina zaboja (X os) - IZMERI
  h_mm: 300.0               # notranja globina zaboja (Y os) - IZMERI
  corners_px: null          # rocni fallback: [[x,y],[x,y],[x,y],[x,y]] vogali dna
  # Visina in debelina stene sta neobvezni. Ce sta podani, postane zgornji rob
  # zaboja druga ravnina na znani visini - to je edini vir absolutnega merila,
  # ki deluje tudi pri strogo navpicni kameri (glej ROADMAP, ugotovitev K1).
  wall_height_mm: null
  wall_thickness_mm: null
  rim_w_mm: null            # neobvezno: zunanji dimenziji zgornjega roba, ce ju
  rim_h_mm: null            # merilo neposredno (namesto izpeljave iz debeline)
  # Referencna ravnina za koordinatni sistem:
  #   auto - dno zaboja (privzeto),
  #   rim  - zgornji rob zaboja. Uporabi pri POLNEM zaboju, kjer dna ni videti;
  #          zahteva wall_height_mm (in debelino ali dimenzije roba). Izhodisce
  #          se prestavi z roba na dno, tako da koordinate ostanejo iste.
  # EKSPERIMENTALNO: 'rim' pravilno postavi X in Y (izmerjeno 4 mm na polnem
  # zaboju, proti 34 mm z nevidnim dnom), visina Z pa je zanesljiva le ob dobrem
  # f_px - podaj camera.working_distance_mm.
  reference_plane: auto
  detect:
    blur_ksize: 5
    canny_low: 30
    canny_high: 90
    close_kernel_px: 5
    min_area_frac: 0.08     # min. delez slike, ki ga mora pokrivati kvadrilateral
    max_area_frac: 0.98
    approx_eps_frac: 0.02   # eps za approxPolyDP kot delez oboda
    rim_min_area_ratio: 1.02    # zgornji rob mora biti vsaj toliko vecji od dna
    rim_max_plane_angle_deg: 3.0    # dno in rob morata biti vzporedna
    rim_max_lateral_offset_mm: 2.0  # in soosna; izmerjeno loci dobre od slabih ocen
    nested_inner_ratio: 0.35    # ce je znotraj kandidata drug kvadrilateral s tem
                                # delezem povrsine, je kandidat zunanji rob zaboja
    scale_select_min_flanges: 3      # izbira pravega pravokotnika po premerih prirobnic
    scale_select_quantile: 25.0      # spodnja plast prirobnic lezi na dnu => razmerje 1
    scale_select_max_error: 0.04
    region_close_px: 9          # zapiranje lukenj v segmentiranem obmocju dna
    hull_search_iterations: 24  # iskanje eps za approxPolyDP na konveksni ovojnici
    candidate_merge_px: 8.0     # kandidata bliznja na toliko px sta isti pravokotnik
    max_aspect_deviation: 0.35  # dovoljeno odstopanje razmerja stranic v sliki od w:h
    min_corner_angle_deg: 55  # kvadrilateral mora biti priblizno pravokoten
    max_corner_angle_deg: 125
    hough_threshold: 110
    hough_min_line_frac: 0.20
    hough_max_gap_px: 25
    # izostritev vogalov z ortogonalno regresijo stranic na subpixel robovih
    side_peak_bin_px: 1.0       # iskanje prevladujocega roba v pasu (histogram odmikov)
    side_peak_window_px: 4.0    # sirina okna okoli najdenega roba
    side_peak_min_fraction: 0.35  # rob steje za mocan pri tem delezu najmocnejsega
    side_band_coarse_px: 30.0   # prvi, grobi prehod (zacetna ocena je lahko mocno zgresena)
    side_band_px: 6.0           # drugi, fini prehod
    side_corner_skip_frac: 0.06
    side_min_points: 40
    side_trim_iterations: 2

gripper:
  suction_cup_diameter_mm: 7.0   # podal uporabnik
  require_full_cup_clearance: false   # true => kandidat brez polnega naleganja cascice pade ven

camera:
  principal_point_px: null   # null => sredina slike
  f_px_prior: null           # opcijski prior na goriscno razdaljo
  working_distance_mm: null  # opcijska delovna razdalja (z homografijo da f_px)

autocalib:
  vanishing:
    max_vp_distance_diag: 60.0   # |v - c| > to*diagonala => stranici sta vzporedni, VP neuporaben
    min_f_px: 150.0
    max_f_px: 30000.0
  refine:
    # PRIVZETO IZKLOPLJENO. Obe cenilki sta izmerjeno presibki: na redkih scenah
    # se sploh ne sprozita (obcutljivost ~0), na gosti sceni pa se je
    # plane_consensus sprozil in dal f = 3600 namesto 1300 (177 % napake).
    # Zanesljivi viri f so: podatek o steni zaboja, delovna razdalja in
    # izginjajoce tocke. Glej ROADMAP, ugotovitvi K1 in K13.
    enabled: false
    # plane_consensus: normale plosko lezecih prirobnic morajo biti vzporedne z
    #   normalo dna (ucinek prvega reda).
    # pair_consistency: nesoglasje notranje in zunanje elipse (drugi red v r/Z).
    method: plane_consensus
    min_pairs: 2                 # za pair_consistency
    min_flanges: 3               # za plane_consensus
    plane_percentile: 35.0       # robusten kvantil (stakani kosi so res nagnjeni)
    f_lo_factor: 0.35            # obseg iskanja okoli zacetne ocene
    f_hi_factor: 3.0
    grid_points: 48
    normal_weight: 2.0
    center_weight: 1.0
    sensitivity_delta: 0.15      # relativni odmik f za oceno obcutljivosti cenilke
    min_sensitivity: 0.12        # [deg] pod tem je problem degeneriran (npr. fronto-paralelna scena)
  scale_check:
    flat_tilt_deg_max: 12.0
    ratio_tolerance: 0.08
  max_f_disagreement: 0.25       # relativno neujemanje ocen f_px, ki se se tolerira
  fallback_f_px: 1200.0          # zadnja sila, ko ni nobenega drugega vira

preprocess:
  clahe_clip: 2.5
  clahe_grid: 8
  bilateral_d: 7
  bilateral_sigma_color: 40
  bilateral_sigma_space: 7
  specular_abs_threshold: 245    # nasiceni piksli
  specular_percentile: 99.3      # ali zgornji percentil svetlosti
  specular_dilate_px: 3
  specular_min_blob_px: 6

edges:
  canny_low: 40
  canny_high: 110
  sobel_ksize: 3
  subpixel_step_px: 1.0
  subpixel_max_shift_px: 0.75
  gradient_blur_sigma: 0.8   # blago glajenje surove slike pred merjenjem lege roba
  min_contour_points: 24

ellipse:
  min_points: 24
  max_split_depth: 3
  max_rms_px: 1.2              # Sampsonov RMS, nad katerim se kontura razbije
  min_semi_major_px: 6.0
  max_semi_major_px: 400.0
  min_axis_ratio: 0.12         # b/a; pod tem je prirobnica skoraj navpicna
  min_support_ratio: 0.25      # delez oboda, podprt z robnimi tockami
  # Sistematicni odmik lege roba se lahko oceni iz znanega razmerja premerov.
  # Privzeto izklopljeno: izmerjeno je, da tako dobimo le SKUPNO komponento
  # odmika obeh robov, ta pa je bila na testnem setu ~0 (zunanji rob ima +0.13 px,
  # notranji +0.04 px - razlike ta model ne vidi). Vklopi le, kadar je znano, da
  # sta oba robova zamaknjena enako (npr. razostritev ali posneti rob kosa).
  estimate_edge_bias: false
  edge_bias_min_samples: 8
  edge_bias_max_px: 1.5
  edge_bias_max_spread_px: 0.06
  polarity_threshold: 0.25     # |polariteta| pod tem pragom je vloga roba nedolocena
  duplicate_center_px: 4.0     # zdruzevanje podvojenih fitov
  duplicate_axis_ratio: 0.08
  pairing:
    max_center_offset_ratio: 0.22   # |c_in - c_out| / a_out
    size_ratio_tolerance: 0.10      # odstopanje (a_in/a_out) od D_in/D_out;
                                    # ohlapnejsa toleranca sprejme sence in odseve kot 'zunanjo' elipso
    axis_ratio_tolerance: 0.22      # ujemanje sploscenosti
    angle_tolerance_deg: 22.0       # ujemanje orientacije (le pri izrazitih elipsah)
    angle_check_min_eccentricity: 0.35

pose:
  max_pair_normal_angle_deg: 25.0  # neujemanje normal notranje/zunanje elipse
  max_pair_center_ratio: 0.30      # |C_in - C_out| / r_out
  max_tilt_deg: 75.0
  unpaired_confidence: 0.25        # samostojna elipsa brez para
  unpaired_ambiguous_tilt_deg: 10.0  # nad tem naklonom je smer nagiba brez para nezanesljiva
  min_confidence: 0.05

scoring:
  weights:
    height: 0.35          # visji Z = manj zakopan
    tilt: 0.15
    occlusion: 0.15
    wall_margin: 0.08
    cup_clearance: 0.07
    # Zaupanje mora steti pri rangiranju: kandidat brez para (npr. rob sence)
    # sicer prehiti trdno detektirano prirobnico in robot seze v prazno.
    confidence: 0.20
  tilt_full_penalty_deg: 45.0
  wall_margin_good_mm: 40.0
  # Dovoljeno odstopanje velikosti elipse od pricakovane pri njeni globini.
  # Ozko okno, ker je globina ze ocenjena iz iste elipse - razmerje mora biti ~1.
  size_ratio_min: 0.80
  size_ratio_max: 1.60
  ring_samples: 72
  occluder_min_confidence: 0.3   # dvomljiva detekcija ne sme blokirati kolobarja trdne
  same_piece_distance_mm: 12.0   # blizje od tega je ista prirobnica, ne oviranje
  ring_block_margin_px: 2.0
  min_free_arc_deg: 25.0
  min_score: 0.0
  # Preverjanje verjetnosti visine (le ko je okvir zaboja na voljo): kos ne more
  # biti pod dnom niti visje od kupa, ki ga zaboj sploh dopusca.
  z_min_mm: -8.0
  z_max_mm: 120.0

evaluate:
  match_radius_factor: 0.7   # najvecja 3D razdalja za parjenje z ground truth (x D_out)
  detection_tolerance_px: 12.0  # toleranca za detekcijo v sliki (neodvisno od kalibracije)

output:
  max_candidates: 50
  round_decimals: 3

debug:
  dir: debug
  overlay_thickness: 1

# Parametri generatorja sinteticnih scen (primarni testni set).
synth:
  supersample: 4
  image_width: 1280
  image_height: 960
  f_px_min: 950.0
  f_px_max: 1700.0
  distance_mm_min: 600.0
  distance_mm_max: 900.0
  camera_tilt_deg_max: 7.0
  camera_roll_deg_max: 3.0
  camera_offset_mm: 25.0
  n_flanges_min: 4
  n_flanges_max: 10
  placement_attempts: 40
  wall_margin_mm: 30.0
  stack_probability: 0.45
  stacked_tilt_deg_max: 26.0
  flat_tilt_deg_sigma: 2.0
  wall_height_mm: 60.0
  wall_thickness_mm: 8.0
  background_level: 32.0
  wall_level: 66.0
  bottom_level: 104.0
  metal_level_min: 120.0
  metal_level_max: 205.0
  shadow_expand: 1.10
  shadow_darkening: 0.62
  light_direction: [0.25, 0.15, -1.0]
  # Poln zaboj (dno ni vidno) in vijacne luknje - lastnosti resnicnih slik.
  dense_fill: false
  dense_wall_margin_mm: 25.0
  dense_tilt_deg_max: 30.0
  bolt_hole_count: 0
  bolt_circle_factor: 1.0
  bolt_hole_diameter_mm: 3.5
  specular_enabled: true
  specular_probability: 0.45
  blur_sigma: 0.9
  noise_sigma: 2.5

logging:
  level: INFO
