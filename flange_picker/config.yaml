# Vse konstante in pragovi sistema. Nic ni hardcodirano v kodi -
# koda bere izkljucno iz te datoteke (glej config.py).

flange:
  d_out_mm: 49.0            # zunanji premer prirobnice (podal uporabnik)
  d_in_mm: 25.3             # izmerjeno IZ FOTOGRAFIJE: razmerje luknja/obris = 0.517
                            # (mediana cez stiri jasne kose); potrdi s kljunastim merilom
  # Pricakovan polmer obrisa v pikslih. Ce je podan, se elipse drugih velikosti
  # zavrzejo se pred parjenjem - nujno pri kosih s perforirano povrsino, ki dajo
  # na stotine drobnih elips. Odcitaj ga z ene debug slike ali izracunaj iz
  # merila zaboja.
  # Izmerjeno na IMG_20260816_173932.jpg, zmanjsani na 1600 px sirine.
  # Pri drugi locljivosti PRERACUNAJ (sorazmerno s sirino slike).
  expected_outer_radius_px: 91.5
  radius_window: 0.30
  diameter_tolerance_mm: 0.5
  thickness_min_mm: 1.0
  thickness_max_mm: 2.0

box:
  w_mm: 400.0               # notranja sirina zaboja (X os) - IZMERI
  h_mm: 300.0               # notranja globina zaboja (Y os) - IZMERI
  corners_px: null          # rocni fallback: [[x,y],[x,y],[x,y],[x,y]] vogali dna
  # Visina in debelina stene sta neobvezni. Ce sta podani, postane zgornji rob
  # zaboja druga ravnina na znani visini - to je edini vir absolutnega merila,
  # ki deluje tudi pri strogo navpicni kameri (glej ROADMAP, ugotovitev K1).
  wall_height_mm: null
  wall_thickness_mm: null
  rim_w_mm: null            # neobvezno: zunanji dimenziji zgornjega roba, ce ju
  rim_h_mm: null            # merilo neposredno (namesto izpeljave iz debeline)
  # Referencna ravnina za koordinatni sistem:
  #   auto - dno zaboja (privzeto),
  #   none - zaboja sploh ne uporabi (koritasti zaboji s posevnimi stenami, kjer
  #          noben viden pravokotnik ni dno; naklon se meri glede na opticno os),
  #   rim  - zgornji rob zaboja. Uporabi pri POLNEM zaboju, kjer dna ni videti;
  #          zahteva wall_height_mm (in debelino ali dimenzije roba). Izhodisce
  #          se prestavi z roba na dno, tako da koordinate ostanejo iste.
  # EKSPERIMENTALNO: 'rim' pravilno postavi X in Y (izmerjeno 4 mm na polnem
  # zaboju, proti 34 mm z nevidnim dnom), visina Z pa je zanesljiva le ob dobrem
  # f_px - podaj camera.working_distance_mm.
  # Za ta zaboj: 'none'. Zaboj je koritast s posevnimi stenami in poln do vrha,
  # zato noben viden pravokotnik ni ravnina dna. Lazen okvir je dal naklon 50-67
  # stopinj namesto pravih 7-18. Brez okvira so nakloni pravilni, koordinate pa
  # niso v milimetrih - za robota zadosca relativno rangiranje.
  reference_plane: none
  detect:
    blur_ksize: 5
    canny_low: 30
    canny_high: 90
    close_kernel_px: 5
    min_area_frac: 0.08     # min. delez slike, ki ga mora pokrivati kvadrilateral
    max_area_frac: 0.98
    approx_eps_frac: 0.02   # eps za approxPolyDP kot delez oboda
    rim_min_area_ratio: 1.02    # zgornji rob mora biti vsaj toliko vecji od dna
    rim_max_plane_angle_deg: 3.0    # dno in rob morata biti vzporedna
    rim_max_lateral_offset_mm: 2.0  # in soosna; izmerjeno loci dobre od slabih ocen
    nested_inner_ratio: 0.35    # ce je znotraj kandidata drug kvadrilateral s tem
                                # delezem povrsine, je kandidat zunanji rob zaboja
    scale_select_min_flanges: 3      # izbira pravega pravokotnika po premerih prirobnic
    scale_select_quantile: 25.0      # spodnja plast prirobnic lezi na dnu => razmerje 1
    scale_select_max_error: 0.04
    region_close_px: 9          # zapiranje lukenj v segmentiranem obmocju dna
    hull_search_iterations: 24  # iskanje eps za approxPolyDP na konveksni ovojnici
    candidate_merge_px: 8.0     # kandidata bliznja na toliko px sta isti pravokotnik
    max_aspect_deviation: 0.35  # dovoljeno odstopanje razmerja stranic v sliki od w:h
    min_corner_angle_deg: 55  # kvadrilateral mora biti priblizno pravokoten
    max_corner_angle_deg: 125
    hough_threshold: 110
    hough_min_line_frac: 0.20
    hough_max_gap_px: 25
    # izostritev vogalov z ortogonalno regresijo stranic na subpixel robovih
    side_peak_bin_px: 1.0       # iskanje prevladujocega roba v pasu (histogram odmikov)
    side_peak_window_px: 4.0    # sirina okna okoli najdenega roba
    side_peak_min_fraction: 0.35  # rob steje za mocan pri tem delezu najmocnejsega
    side_band_coarse_px: 30.0   # prvi, grobi prehod (zacetna ocena je lahko mocno zgresena)
    side_band_px: 6.0           # drugi, fini prehod
    side_corner_skip_frac: 0.06
    side_min_points: 40
    side_trim_iterations: 2

gripper:
  suction_cup_diameter_mm: 7.0   # podal uporabnik
  require_full_cup_clearance: false   # true => kandidat brez polnega naleganja cascice pade ven

camera:
  principal_point_px: null   # null => sredina slike
  f_px_prior: null           # opcijski prior na goriscno razdaljo
  working_distance_mm: null  # opcijska delovna razdalja (z homografijo da f_px)

autocalib:
  vanishing:
    max_vp_distance_diag: 60.0   # |v - c| > to*diagonala => stranici sta vzporedni, VP neuporaben
    min_f_px: 150.0
    max_f_px: 30000.0
  refine:
    # PRIVZETO IZKLOPLJENO. Obe cenilki sta izmerjeno presibki: na redkih scenah
    # se sploh ne sprozita (obcutljivost ~0), na gosti sceni pa se je
    # plane_consensus sprozil in dal f = 3600 namesto 1300 (177 % napake).
    # Zanesljivi viri f so: podatek o steni zaboja, delovna razdalja in
    # izginjajoce tocke. Glej ROADMAP, ugotovitvi K1 in K13.
    enabled: false
    # plane_consensus: normale plosko lezecih prirobnic morajo biti vzporedne z
    #   normalo dna (ucinek prvega reda).
    # pair_consistency: nesoglasje notranje in zunanje elipse (drugi red v r/Z).
    method: plane_consensus
    min_pairs: 2                 # za pair_consistency
    min_flanges: 3               # za plane_consensus
    plane_percentile: 35.0       # robusten kvantil (stakani kosi so res nagnjeni)
    f_lo_factor: 0.35            # obseg iskanja okoli zacetne ocene
    f_hi_factor: 3.0
    grid_points: 48
    normal_weight: 2.0
    center_weight: 1.0
    sensitivity_delta: 0.15      # relativni odmik f za oceno obcutljivosti cenilke
    min_sensitivity: 0.12        # [deg] pod tem je problem degeneriran (npr. fronto-paralelna scena)
  scale_check:
    flat_tilt_deg_max: 12.0
    ratio_tolerance: 0.08
  max_f_disagreement: 0.25       # relativno neujemanje ocen f_px, ki se se tolerira
  fallback_f_px: 1200.0          # zadnja sila, ko ni nobenega drugega vira

preprocess:
  # gama < 1 dvigne temne dele slike (kosi ob steni zaboja, v senci). Deluje le
  # na sliko za iskanje robov; lega robov se meri na surovi sliki, zato tonska
  # krivulja ne vnese sistematicnega odmika.
  gamma: 1.0
  clahe_clip: 2.5      # 0 ali manj = brez CLAHE
  clahe_grid: 8
  bilateral_d: 7       # 0 = brez bilateralnega filtra
  bilateral_sigma_color: 40
  bilateral_sigma_space: 7
  specular_abs_threshold: 245    # nasiceni piksli
  specular_percentile: 99.3      # ali zgornji percentil svetlosti
  specular_dilate_px: 3
  specular_min_blob_px: 6

edges:
  canny_low: 40
  canny_high: 110
  sobel_ksize: 3
  subpixel_step_px: 1.0
  subpixel_max_shift_px: 0.75
  gradient_blur_sigma: 0.8   # blago glajenje surove slike pred merjenjem lege roba
  min_contour_points: 24

ellipse:
  # Vir kandidatnih elips:
  #   contours     - lastni fit po konturah (razpolavljanje ob visokem residualu),
  #   edge_drawing - OpenCV EdgeDrawing (zdruzevanje lokov, po vzoru ELSD),
  #   both         - oboje, nato zdruzevanje podvojenih.
  # Izmerjeno na resnicni fotografiji: contours 11 elips prave velikosti,
  # edge_drawing 30. Kateri so res kosi, odlocijo sele polariteta, parjenje in
  # mera vidnosti.
  detector: both
  edge_drawing:
    pf_mode: false
    gradient_threshold: 6      # nizek prag; navlako odstranijo poznejsa preverjanja
    anchor_threshold: 1
    min_path_length: 30
    nfa_validation: true
    sigma: 1.0
  min_points: 24
  max_split_depth: 3
  max_rms_px: 1.2              # Sampsonov RMS, nad katerim se kontura razbije
  min_semi_major_px: 6.0
  max_semi_major_px: 400.0
  min_axis_ratio: 0.12         # b/a; pod tem je prirobnica skoraj navpicna
  # Kako se meri podprtost obrisa (= koliko kosa je vidnega):
  #   gradient  - iz gradienta slike vzdolz oboda (izmerjeno najbolje, korelacija
  #               z resnicno vidnostjo 0.992),
  #   proximity - blizina robnih tock (0.935; pri perforiranih kosih zavedena).
  support_method: gradient
  # Prag radialnega gradienta glede na merilo scene. Izmerjeno na resnicni
  # fotografiji: pri 0.25 da pravi vrhnji kos vidnost 0.81, zakopana pa 0.59 in
  # 0.50 - locitev je jasna. Vecji prag locitev ohrani, a znizuje vse vrednosti.
  support_gradient_factor: 0.25
  # Merilo kontrasta: lokalno (iz okolice kosa) ali globalno (iz cele slike).
  # Lokalno je nujno pri neenakomerni osvetlitvi - sicer je enakomerno a slabse
  # osvetljen kos videti prekrit, ceprav je popolnoma viden.
  support_local_scale: true
  support_search_band_px: 1.0   # iskanje roba vzdolz normale (fit ni popoln)
  support_gradient_floor: 5.2   # ~ q/sin(tau) iz LSD; prepreci "robove" v sumu
  support_scale_percentile: 95.0
  min_support_ratio: 0.25      # delez vidnega oboda, pod katerim kandidat pade
  # Zamasanost kolobarja: delez POVRSINE med luknjo in obrisom, cez katero tece
  # tuj rob. Vidnost meri le obod - kos, ki mu drug kos lezi cez sredino, ima
  # lahko obod skoraj cel, a je neprijemljiv. Prag je isti kot pri vidnosti
  # (delez lokalnega percentila gradienta).
  ring_clutter_factor: 0.35
  ring_clutter_angular_samples: 96
  ring_clutter_radial_samples: 5
  ring_clutter_margin: 0.06    # odmik od obeh robov, da se ne steje robov samega kosa
  # Kolobar se razdeli na kotne izseke; merodajen je presezek povprecja nad
  # najcistejso cetrtino izsekov. Tako je mera sama sebi referenca in ne potrebuje
  # ne drugih kandidatov v sceni ne poznavanja povrsinske obdelave kosa.
  ring_clutter_sectors: 12
  ring_clutter_min_sector_fraction: 0.5   # izsek z manj vidnimi tockami se ne steje
  # Sistematicni odmik lege roba se lahko oceni iz znanega razmerja premerov.
  # Privzeto izklopljeno: izmerjeno je, da tako dobimo le SKUPNO komponento
  # odmika obeh robov, ta pa je bila na testnem setu ~0 (zunanji rob ima +0.13 px,
  # notranji +0.04 px - razlike ta model ne vidi). Vklopi le, kadar je znano, da
  # sta oba robova zamaknjena enako (npr. razostritev ali posneti rob kosa).
  estimate_edge_bias: false
  edge_bias_min_samples: 8
  edge_bias_max_px: 1.5
  edge_bias_max_spread_px: 0.06
  polarity_threshold: 0.25     # |polariteta| pod tem pragom je vloga roba nedolocena
  duplicate_center_px: 4.0     # zdruzevanje podvojenih fitov
  duplicate_axis_ratio: 0.08
  pairing:
    max_center_offset_ratio: 0.22   # |c_in - c_out| / a_out
    size_ratio_tolerance: 0.10      # odstopanje (a_in/a_out) od D_in/D_out;
                                    # ohlapnejsa toleranca sprejme sence in odseve kot 'zunanjo' elipso
    # Obris brez najdenega para: luknja se mora na znanem polmeru vseeno videti.
    # Navidezna elipsa se zgradi iz geometrije (D_in/D_out) in se na njej izmeri
    # ista podprtost kot sicer. Izmerjeno na resnicni fotografiji: pravi kos 0.42
    # in 0.85, nakljucen krog cez kup stakanih kosov 0.23-0.38.
    min_virtual_hole_support: 0.40
    axis_ratio_tolerance: 0.22      # ujemanje sploscenosti
    angle_tolerance_deg: 22.0       # ujemanje orientacije (le pri izrazitih elipsah)
    angle_check_min_eccentricity: 0.35

# Vecprehodna detekcija: ista slika, vec razlicnih obdelav, nato skupna analiza.
# Ena sama obdelava ima eno samo delovno tocko - CLAHE, ki dvigne slabo osvetljen
# kos ob steni zaboja, na dobro osvetljenih napihne sum. Kandidati vseh prehodov
# se zdruzijo v gruce; koliko prehodov je gruco naslo, je NEODVISEN dokaz o njeni
# resnicnosti (nakljucna elipsa iz lokov vec kosov prezivi eno obdelavo, redko vec).
multipass:
  enabled: true
  cluster_center_frac: 0.10     # dve elipsi sta ista, ce sta sredisci blizje od tega
  cluster_center_floor_px: 3.0  # deleza polosi (oz. te spodnje meje v px)
  cluster_axis_ratio: 0.10      # in se polosi ujemata na ta delez
  # Koliko razlicnih obdelav mora najti isto elipso (1 = brez vrat). Izmerjeno na
  # resnicni fotografiji: vseh 12 pravilnih detekcij ima 2-5 glasov, medtem ko ima
  # 20 od 23 laznih natanko 1. En sam glas pomeni, da je elipsa obstala le pri eni
  # nastavitvi kontrasta - to je znacilnost nakljucnega zlepka lokov, ne kosa.
  min_votes: 2
  # Prehod, katerega fit se uporabi za geometrijo, kadar je kos v njem najden.
  # Ostali prehodi so tu zato, da kos sploh NAJDEJO; pragovi referencnega pa so
  # umerjeni na natancnost lege roba.
  geometry_pass: osnovni
  passes:
    # Referencni prehod - isti parametri kot pri enoprehodnem tecaju.
    - name: osnovni
      overrides: {}
    # Mocan lokalni kontrast + nizji prag gradienta: za kose ob robu zaboja, ki so
    # enakomerno, a slabse osvetljeni. Na dobro osvetljenih delih doda navlako -
    # to poberejo polariteta, parjenje in vidnost.
    - name: kontrast
      overrides:
        preprocess: {clahe_clip: 6.0, clahe_grid: 12}
        ellipse:
          edge_drawing: {gradient_threshold: 4, anchor_threshold: 0}
    # Gama dvigne sence globalno in monotono, brez izmisljenega lokalnega kontrasta.
    - name: gama
      overrides:
        preprocess: {gamma: 0.55, clahe_clip: 2.0}
        ellipse:
          edge_drawing: {gradient_threshold: 8}
    # Malo CLAHE, mocnejse glajenje in daljsa najkrajsa pot: samo veliki, gladki
    # obrisi. Teksture povrsine in perforacij ta prehod ne vidi.
    - name: gladko
      overrides:
        preprocess: {clahe_clip: 1.0, bilateral_d: 9, bilateral_sigma_color: 60}
        ellipse:
          edge_drawing: {sigma: 1.6, min_path_length: 45, gradient_threshold: 10}
    # Pomanjsana slika: sum in tekstura se povprecita, obris kosa pa ostane.
    # Zdruzevanje lokov v elipso je pri manj tockah bolj popustljivo.
    - name: pomanjsano
      scale: 0.6
      overrides:
        ellipse:
          edge_drawing: {min_path_length: 20, gradient_threshold: 5}

pose:
  max_pair_normal_angle_deg: 25.0  # neujemanje normal notranje/zunanje elipse
  max_pair_center_ratio: 0.30      # |C_in - C_out| / r_out
  max_tilt_deg: 75.0
  unpaired_confidence: 0.25        # samostojna elipsa brez para
  unpaired_ambiguous_tilt_deg: 10.0  # nad tem naklonom je smer nagiba brez para nezanesljiva
  min_confidence: 0.05

scoring:
  weights:
    # Operativno merilo je "kos je na vrhu in prost" - to meri neposredno
    # vidnost oboda, zato ima najvecjo tezo. Naklon pod ~30 stopinj je za sesek
    # vseeno, zato je njegova teza majhna. Visina iz globine je pri 1-2 mm
    # debelih kosih sum in se brez okvira zaboja sploh ne uposteva.
    occlusion: 0.40       # delez vidnega oboda
    height: 0.15          # visji Z = manj zakopan (le ob veljavnem okviru)
    tilt: 0.10
    wall_margin: 0.05
    cup_clearance: 0.05
    # Zaupanje mora steti pri rangiranju: kandidat brez para (npr. rob sence)
    # sicer prehiti trdno detektirano prirobnico in robot seze v prazno.
    confidence: 0.20
    # Soglasje prehodov: koliko razlicnih obdelav slike je naslo isto elipso.
    # Neodvisno od vseh drugih clenov - meri stabilnost detekcije, ne geometrije.
    consensus: 0.10
    # Cistost kolobarja: 1 - delez povrsine kolobarja s tujim robom cez njo.
    ring_clean: 0.15
  tilt_full_penalty_deg: 45.0
  wall_margin_good_mm: 40.0
  # Dovoljeno odstopanje velikosti elipse od pricakovane pri njeni globini.
  # Ozko okno, ker je globina ze ocenjena iz iste elipse - razmerje mora biti ~1.
  size_ratio_min: 0.80
  size_ratio_max: 1.60
  # Dva kandidata, katerih sredisci sta blizje od tega deleza polosi, sta ista
  # prirobnica, detektirana veckrat (iz razlicnih lokov ali virov).
  duplicate_centre_frac: 0.55
  ring_samples: 72
  occluder_min_confidence: 0.3   # dvomljiva detekcija ne sme blokirati kolobarja trdne
  same_piece_distance_mm: 12.0   # blizje od tega je ista prirobnica, ne oviranje
  ring_block_margin_px: 2.0
  # Najvecja dovoljena prekritost obrisa: kos, ki mu je prekritega vec od tega
  # deleza oboda, ni na vrhu in se zavrne.
  # Na sinteticnih scenah popolnoma vidni kos dosega vidnost ~1.0, na resnicni
  # fotografiji pa 0.81 - fit ni popoln, deli obrisa se dotikajo sosedov enake
  # svetlosti. Zato je prag 0.25 in ne 0.10; pri sinteticnih scenah lahko ostrejsi.
  # 0.30 in ne 0.25: z vecprehodno detekcijo se je najbolje viden kos v sceni
  # izboljsal (surova vidnost 0.76 -> 0.83), s tem pa se je dvignila referenca
  # normiranja. Pri 0.25 sta izpadla dva izmerjeno pravilna kosa (26 in 27 %),
  # pri 0.30 sta nazaj in noben lazen kandidat ne pride zraven.
  max_occlusion: 0.30
  # Mera vidnosti je scensko odvisna: popolnoma viden kos doseze ~1.0 na
  # sinteticni sceni, na resnicni fotografiji pa 0.67-0.76 - del obrisa se dotika
  # sosedov iste kovine, kjer kontrasta preprosto ni. Absolutni prag zato ni
  # smiseln. Merilo je najbolje viden kos v tem zaboju; sele tako "10 % prekritosti"
  # pomeni to, kar naj bi. Ce je tudi najboljsi kos pod spodnjo mejo, scena nima
  # dovolj kontrasta in normiranje se ne izvede (z opozorilom).
  occlusion_normalise: true
  occlusion_reference_percentile: 90.0
  occlusion_reference_floor: 0.45
  # Vrata zamasanosti kolobarja: nad tem delezem povrsine s tujim robom cez njo
  # kos ni prost, tudi ce mu je obod skoraj cel viden. Gladka kovinska ploskev da
  # nekaj odstotkov (tekstura, odsevi); prekrit kos znatno vec.
  # 1.0 = vrata izklopljena.
  # Meri se PRESEZEK nad najcistejsimi izseki istega kolobarja, ne absolutna
  # vrednost: perforirana povrsina in vijacne luknje dajo gradient tudi na povsem
  # prostem kosu (sinteticna scena s teksturo 0.31 pri polni vidnosti, resnicna
  # fotografija 0.03-0.05). Prost kos je enakomerno teksturiran, kos s tujim
  # kosom cez sebe pa ima nekaj izsekov mocno umazanih.
  # 1.0 = vrata izklopljena.
  # Izmerjeno: sinteticne scene - popolnoma vidni kosi 0.00-0.10, delno prekriti
  # (vidnih 71-84 %) 0.10-0.20; resnicna fotografija - pravilne detekcije
  # 0.04-0.14, kandidat na kupu stakanih kosov 0.16, drobec 0.22.
  max_ring_clutter_excess: 0.15
  # Sama luknja brez vidnega obrisa pomeni, da obrisa kosa NE vidimo - najpogosteje
  # zato, ker ga prekriva sosed. Rob luknje ima poleg tega vedno mocan kontrast
  # (temna luknja proti svetli kovini), zato taki kandidati po vidnosti krivicno
  # prehitijo trdne detekcije - na resnicni fotografiji je tak kandidat pristal na
  # 3. mestu. Obratno NE velja: sam obris brez najdene luknje je legitimen (luknja
  # je lahko le slabo fitana), zato se ne zavrne, ampak nosi nizje zaupanje.
  # Izklopi le, ce potrebujes zasilno rezervo, ko ni nic drugega.
  reject_lone_hole: true
  min_free_arc_deg: 25.0
  min_score: 0.0
  # Preverjanje verjetnosti visine (le ko je okvir zaboja na voljo): kos ne more
  # biti pod dnom niti visje od kupa, ki ga zaboj sploh dopusca.
  z_min_mm: -8.0
  z_max_mm: 120.0

evaluate:
  match_radius_factor: 0.7   # najvecja 3D razdalja za parjenje z ground truth (x D_out)
  detection_tolerance_px: 12.0  # toleranca za detekcijo v sliki (neodvisno od kalibracije)

output:
  max_candidates: 50
  round_decimals: 3

debug:
  dir: debug
  overlay_thickness: 1

# Parametri generatorja sinteticnih scen (primarni testni set).
synth:
  supersample: 4
  image_width: 1280
  image_height: 960
  f_px_min: 950.0
  f_px_max: 1700.0
