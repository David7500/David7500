org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# Ni napaka, ampak odlocitev: AndroidX ne uporabljamo. Vse, kar rabimo
# (WebView, AlarmManager, NotificationChannel, Ringtone), je v ogrodju od
# API 26 naprej. Brez AndroidX gradnja ne potegne nicesar z Googlovega Mavena
# razen samega AGP, APK pa ostane majhen.
android.useAndroidX=false
android.nonTransitiveRClass=true
kotlin.code.style=official
