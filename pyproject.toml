[project]
name = "kajros"
version = "0.1.0"
description = "Vozni redi, zamude in statistika Slovenskih železnic iz odprtih podatkov"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "gtfs-realtime-bindings>=1.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]

[project.scripts]
kajros = "kajros.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kajros"]
