<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sztrack — kdaj mi pelje vlak</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/static/dashboard.css">
  <link rel="stylesheet" href="/static/connections.css">
</head>
<body class="conn-page">

  <header class="topbar">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f0934f" stroke-width="1.8" stroke-linecap="round">
        <rect x="6" y="3" width="12" height="14" rx="3"></rect><path d="M6 10h12M9 21l-2 2M15 21l2 2M9.5 20h5"></path>
        <circle cx="9" cy="13.5" r="0.9" fill="#f0934f" stroke="none"></circle><circle cx="15" cy="13.5" r="0.9" fill="#f0934f" stroke="none"></circle>
      </svg>
      <span class="brand-name">sztrack</span>
    </div>
    <div class="spacer"></div>
    <a class="top-link" href="/app/map">zemljevid</a>
    <div class="divider"></div>
    <div class="clock-wrap">
      <span id="feed-dot" class="dot"></span>
      <span id="clock" class="clock">--:--:--</span>
    </div>
  </header>

  <main class="conn-main">
    <form id="search" class="search-card" autocomplete="off">
      <div class="field">
        <label for="from">Od</label>
        <input id="from" name="from" list="stations" placeholder="izhodiščna postaja" required>
      </div>
      <button type="button" id="swap" class="swap" title="zamenjaj postaji" aria-label="zamenjaj postaji">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 4v13M7 4L4 7M7 4l3 3M17 20V7M17 20l3-3M17 20l-3-3"></path>
        </svg>
      </button>
      <div class="field">
        <label for="to">Do</label>
        <input id="to" name="to" list="stations" placeholder="ciljna postaja" required>
      </div>
      <div class="field field-date">
        <label for="date">Dan</label>
        <input id="date" name="date" type="date">
      </div>
      <button type="submit" class="go">Poišči</button>
    </form>
    <datalist id="stations"></datalist>

    <div id="result-head" class="result-head"></div>
    <div id="results" class="results"></div>
  </main>

  <script src="/static/common.js"></script>
  <script src="/static/connections.js"></script>
</body>
</html>
