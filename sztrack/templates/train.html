<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ train_no }} — sztrack</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/base.css">
  <link rel="stylesheet" href="/static/dashboard.css">
  <link rel="stylesheet" href="/static/train.css">
</head>
<body class="train-page net-{{ network | default('zeleznica') }}"
      data-train-no="{{ train_no }}" data-network="{{ network | default('zeleznica') }}">

  <header class="topbar">
    <a class="back-link" href="{{ '/app/bus' if network == 'avtobus' else '/app/train' }}"
       title="nazaj na iskalnik">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 5l-7 7 7 7"></path>
      </svg>
      <span>{{ 'avtobusi' if network == 'avtobus' else 'vlaki' }}</span>
    </a>
    <div class="divider"></div>
    <div class="train-head">
      <span class="train-head-code">{{ train_no }}</span>
      <span id="train-mode"></span>
      <span id="train-headsign" class="train-head-sub"></span>
    </div>
    <div class="spacer"></div>
    <div class="mode-switch" id="mode-switch">
      <button type="button" data-mode="simple" aria-pressed="true">preprosto</button>
      <button type="button" data-mode="advanced" aria-pressed="false">napredno</button>
    </div>
    {% include "_nav.html" with context %}
    <div class="divider"></div>
    <div class="clock-wrap">
      <span id="feed-dot" class="dot"></span>
      <span id="clock" class="clock">--:--:--</span>
    </div>
  </header>

  <div class="train-body">

    <section class="col col-run">
      <!-- Kar velja ZDAJ. Na sirokem zaslonu v preprostem pogledu je to levi
           stolpec, casovnica pa desni; na telefonu je oboje eno za drugim. -->
      <div class="run-now">
      <div class="section-title">Ta vožnja</div>
      <div id="run-head"></div>
      <!-- Ziv zemljevid ene voznje. Nalozi se SAMO, kadar ima vozilo GPS lego
           -- vlaki je nimajo nikoli in zanje ta okvir ne obstaja. Leaflet se
           zato prinese sele takrat in ne obtezi vsake strani z vlakom. -->
      <div id="run-map-wrap" class="run-map-wrap" hidden>
        <div class="run-map-head">
          <span class="run-map-title">Kje je zdaj</span>
          <span class="run-map-sub" id="run-map-sub"></span>
          <a class="run-map-full" id="run-map-full" href="/app/map">na velik zemljevid</a>
        </div>
        <div id="run-map" class="run-map"></div>
      </div>
      <div id="train-alerts"></div>
      </div>
      <div id="run-timeline"><div class="empty-state">nalagam …</div></div>
    </section>

    <section class="col col-hist adv-only">
      <div class="section-title">Zgodovina te poti</div>
      <div id="hist-note" class="hist-note"></div>
      <div id="hist-tiles" class="tile-row"></div>

      <figure class="figure" id="fig-profile">
        <figcaption class="fig-title">Zamuda po postajah</figcaption>
        <div class="fig-sub" id="profile-sub"></div>
        <div class="fig-legend" id="profile-legend"></div>
        <div class="fig-body" id="profile-chart"></div>
        <div class="fig-note" id="weather-note" hidden></div>
      </figure>

      <figure class="figure" id="fig-runs">
        <figcaption class="fig-title">Končna zamuda po dnevih</figcaption>
        <div class="fig-sub" id="runs-sub"></div>
        <div class="fig-body" id="runs-chart"></div>
      </figure>

    </section>

  </div>

  <div id="tooltip" class="chart-tooltip" hidden></div>

  <script src="/static/common.js"></script>
  <script src="/static/train.js"></script>
</body>
</html>
