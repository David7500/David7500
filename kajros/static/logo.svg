<!-- Znak Kajros. Dve roki iz istega stebla: siva je vozni red, poudarjena
     resnica -- ista misel kot ime (chronos proti kairosu).
     Barvo prevzame od `currentColor`, zato na avtobusni strani pozeleni. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none"
     stroke-linecap="round">
  <path d="M34 24V72" stroke="currentColor" stroke-opacity="0.5" stroke-width="9"/>
  <path d="M66 26L34 50" stroke="currentColor" stroke-opacity="0.5" stroke-width="9"/>
  <path d="M34 50L66 72" stroke="currentColor" stroke-width="9"/>
</svg>
