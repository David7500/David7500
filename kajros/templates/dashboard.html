<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kajros — živi zemljevid</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/base.css">
  <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>

  <header class="topbar">
    <a class="brand" href="/">
      <svg class="brand-mark" width="20" height="20" viewBox="0 0 96 96" fill="none"
           stroke-linecap="round" aria-hidden="true">
        <path d="M34 24V72" stroke="currentColor" stroke-opacity=".5" stroke-width="9"/>
        <path d="M66 26L34 50" stroke="currentColor" stroke-opacity=".5" stroke-width="9"/>
        <path d="M34 50L66 72" stroke="currentColor" stroke-width="9"/>
      </svg>
      <span class="brand-name">kajros</span>
    </a>
    <div class="spacer"></div>
    {% include "_nav.html" with context %}
    <div class="divider"></div>
    <div class="clock-wrap">
      <span id="feed-dot" class="dot"></span>
      <span id="clock" class="clock">--:--:--</span>
    </div>
  </header>

  <div class="body">
    <aside class="sidebar">
      <!-- Rocaj za zapiranje. Mora biti V plosci: gumb pod njo je ob odprti
           plosci prekrit in ga ni vec mogoce klikniti. -->
      <button type="button" class="sheet-close" id="sheet-close" aria-label="zapri">
        <span class="sheet-grip"></span>
      </button>

      <!-- Iskalnik namesto lestvice najvecjih zamud. Lestvica je odgovarjala
           na vprasanje "kdo danes najbolj zamuja", ki ga na zemljevidu nihce
           nima; vprasanje pred zemljevidom je "kje je MOJ avtobus". -->
      <div class="find">
        <label class="find-label" for="find">Poišči vozilo</label>
        <div class="find-box">
          <input id="find" placeholder="npr. LPP 25 ali IC 502" autocomplete="off"
                 autocapitalize="off" spellcheck="false">
          <button type="button" class="field-clear" id="find-clear" tabindex="-1"
                  aria-label="izbriši" hidden>&times;</button>
        </div>
        <div id="find-list" class="find-list"></div>
      </div>

      <div class="layers">
        <div class="sidebar-title">Kaj naj kaže</div>
        <label class="layer"><input type="checkbox" id="lay-train" checked>
          <span class="layer-key layer-key-train"></span>
          <span class="layer-name">Vlaki</span><span class="layer-n" id="n-train">—</span></label>
        <label class="layer"><input type="checkbox" id="lay-bus" checked>
          <span class="layer-key layer-key-bus"></span>
          <span class="layer-name">Avtobusi</span><span class="layer-n" id="n-bus">—</span></label>
        <label class="layer"><input type="checkbox" id="lay-net" checked>
          <span class="layer-key layer-key-net"></span>
          <span class="layer-name">Železniške proge</span><span class="layer-n"></span></label>
        <label class="layer"><input type="checkbox" id="lay-routes">
          <span class="layer-key layer-key-route"></span>
          <span class="layer-name">Trase vozil na poti</span><span class="layer-n" id="n-routes"></span></label>
        <label class="layer"><input type="checkbox" id="lay-stations" checked>
          <span class="layer-key layer-key-stop"></span>
          <span class="layer-name">Železniške postaje</span><span class="layer-n"></span></label>
        <label class="layer"><input type="checkbox" id="lay-busstops">
          <span class="layer-key layer-key-busstop"></span>
          <span class="layer-name">Avtobusna postajališča</span>
          <span class="layer-n" id="n-busstops"></span></label>
        <label class="layer"><input type="checkbox" id="lay-base" checked>
          <span class="layer-key"></span>
          <span class="layer-name">Podlaga (ceste)</span><span class="layer-n"></span></label>
        <label class="layer"><input type="checkbox" id="lay-quiet" checked>
          <span class="layer-key"></span>
          <span class="layer-name">Zatemni podlago</span><span class="layer-n"></span></label>
        <label class="layer"><input type="checkbox" id="lay-labels">
          <span class="layer-key"></span>
          <span class="layer-name">Dodatna imena krajev</span><span class="layer-n"></span></label>

      </div>

      <p class="sidebar-note">
        Vlak stoji na zadnji postaji z meritvijo (obroč), avtobus na izmerjeni
        legi. Zamuda je na kartici ob kliku.
      </p>
    </aside>

    <!-- Na telefonu je stranski stolpec spodnja plosca in privzeto zaprt:
         zemljevid je razlog za obisk in ne sme deliti zaslona z legendo. -->
    <button type="button" class="sheet-toggle" id="sheet-toggle" aria-expanded="false">
      <span class="sheet-grip"></span>
      <span class="sheet-label">Poišči vozilo in nastavitve</span>
    </button>

    <main class="map-area">
      <div id="map"></div>
      <div id="me-note" class="label-note label-note-3" hidden></div>
      <div id="stop-note" class="label-note label-note-2" hidden></div>
      <div id="label-note" class="label-note" hidden></div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/common.js"></script>
  <script src="/static/dashboard.js"></script>
</body>
</html>
