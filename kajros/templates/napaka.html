<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ koda }} — kajros</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{ s('pisave.css') }}">
  <link rel="stylesheet" href="{{ s('base.css') }}">
  <link rel="stylesheet" href="{{ s('home.css') }}">
</head>
<body class="home-page">

  <main class="home">
    <header class="home-head">
      <a class="home-brand" href="/" style="text-decoration:none">
        <svg class="brand-mark" width="26" height="26" viewBox="0 0 96 96" fill="none"
             stroke-linecap="round" aria-hidden="true">
          <path d="M34 24V72" stroke="#f0934f" stroke-opacity=".5" stroke-width="9"/>
          <path d="M66 26L34 50" stroke="#f0934f" stroke-opacity=".5" stroke-width="9"/>
          <path d="M34 50L66 72" stroke="#f0934f" stroke-width="9"/>
        </svg>
        <span>kajros</span>
      </a>
      <p class="napaka-koda">{{ koda }}</p>
      <p class="home-lead">{{ sporocilo }}</p>
    </header>

    <nav class="home-more">
      <a class="more-link" href="/app/train">
        <strong>Vlaki</strong>
        <span>odhodi, zveze in zamude na železnici</span>
      </a>
      <a class="more-link" href="/app/bus">
        <strong>Avtobusi</strong>
        <span>odhodi in zamude medkrajevnih ter mestnih linij</span>
      </a>
      <a class="more-link" href="/app/map">
        <strong>Živi zemljevid</strong>
        <span>kje so vlaki in avtobusi ta trenutek</span>
      </a>
    </nav>
  </main>

</body>
</html>
